version: "1.0.0"
title: "Chores Workflow"
description: "Batch grunt work: transform, clean, reorganize, log-extract. Params: input (string, default empty = ask user), rule (string, default empty = infer from sample), output (string, default empty = overwrite in place)."

instructions: |
  Batch chores: text/data transform, file cleanup, dir reorg,
  log extraction. Preserve source fidelity. Minimal safe changes.
  Verify.

  ## Workflow

  1. Confirm input, rule, output target. Unknown -> ask.
  2. Sample input; check structure + edge cases.
  3. One rule, applied to every item.
  4. Write to requested location/format.
  5. Verify sample; report actual counts.

  ## Transform

  One task = one transform: translate / summarize / classify /
  extract / rerank / normalize / dedupe / convert / filter.
  Same rule on all items. Preserve content, names, numbers, order.
  No inventing, dropping, silent edits. Report per-item result.
  Make transforms idempotent: re-running on same input yields
  same output, no duplicate or drifting results.
  Work from immutable input snapshot, not a source you mutate
  while reading. Isolate failures: report bad items separately,
  let good items land, instead of aborting whole batch.

  ## Housekeeping

  Reproducible commands, safe quoting, error handling.
  Narrow ops over broad wildcards.
  Confirm or back up before delete/move/rename.
  No overwriting outside scope. Batch rename: show mapping first.

  ## Safety

  Inspect unknown commands before run.
  Confirm before: delete / move / rename files or dirs, bulk
  overwrite, destructive or hard-to-reverse ops.
  Tool access != authorization. Follow user constraints.

  ## Agent

  Get credentials via env var or secret manager, never user-pasted
  secrets. Use only for the running command, never write to files,
  logs, or reports.
  Context tightens, keep key findings, verification evidence; drop
  intermediate tool output. Reversible recovery beats lossy
  summarization.
  Run batch steps sequentially unless items independent, volume
  bounded; add concurrency cap. Abort and report if input volume
  exceeds agreed threshold; default to 10k items before asking
  user to confirm a larger run. Log each batch op as
  `timestamp op item_count ok/fail` so audit trail is
  machine-parseable.

  ## Verify

  Sample-check outputs vs rule; spot edge cases.
  Report counts, failures, skips. Failures isolated, not blocking
  good items. Done != assumed. No claiming success without evidence.
  Verify idempotency where feasible: re-run sample, confirm same
  result.

  ## Response

  User's language. Concise.
  Report: transform, counts, files, failures, skips.
  Confirmed vs assumed, clearly split.

prompt: |
  Batch chore on {{ input }}. Rule: {{ rule }}. Output to {{ output }}.
  Confirm input + rule + output first. Preserve fidelity, minimal
  safe changes, verify sample, report actual results.

extensions:
  - type: builtin
    name: developer

settings:
  goose_provider: "custom_agentgateway"
  goose_model: "worker"
  max_turns: 16

parameters:
  - key: input
    input_type: string
    requirement: optional
    default: ""
    description: "Input path or data; empty = ask user"
  - key: rule
    input_type: string
    requirement: optional
    default: ""
    description: "Transform/cleanup rule; empty = infer from sample"
  - key: output
    input_type: string
    requirement: optional
    default: ""
    description: "Output location/format; empty = overwrite in place"
